services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sankalp
      POSTGRES_USER: sankalp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U sankalp"], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sankalp:${POSTGRES_PASSWORD:-localdevpassword}@db:5432/sankalp
      STORAGE_DIR: /data
    volumes: ["pdfdata:/data"]
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
  web:
    build: {context: ., dockerfile: Dockerfile.frontend}
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  pgdata:
  pdfdata:
